<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Comunica">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <title>Comunica</title>
</head>

<body>
  <div id="header-container">
    <div id="core-left" class="core-section"></div>

    <div id="sentence-bar">
      <div id="sentence-words">
        <span id="placeholder">Tocca un simbolo per iniziare</span>
      </div>
      <div id="sentence-actions">
        <button id="clear-btn" class="icon-btn" aria-label="Cancella">✕</button>
        <button id="speak-btn" class="icon-btn" aria-label="Pronuncia">🔊</button>
      </div>
    </div>

    <div id="core-right" class="core-section"></div>

    <div id="custom-actions">
      <button id="add-custom-btn" class="icon-btn action-btn" aria-label="Aggiungi personalizzato"
        title="Aggiungi pittogramma">➕</button>
      <button id="manage-custom-btn" class="icon-btn action-btn" aria-label="Gestisci personalizzati"
        title="Gestisci pittogrammi">⚙️</button>
    </div>
  </div>

  <div id="category-tabs"></div>

  <main id="grid"></main>

  <div id="custom-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Aggiungi Pittogramma Personalizzato</h2>
        <button id="close-modal" class="close-btn">✕</button>
      </div>
      <form id="custom-form">
        <div class="form-group">
          <label for="custom-label">Nome / Testo</label>
          <input type="text" id="custom-label" required placeholder="Es: Mamma, Papà, Maria">
        </div>
        <div class="form-group">
          <label for="custom-category">Categoria</label>
          <select id="custom-category" required>
            <option value="Persone">Persone</option>
            <option value="Sentimenti">Sentimenti</option>
            <option value="Bisogni">Bisogni</option>
            <option value="Azioni">Azioni</option>
          </select>
        </div>
        <div class="form-group">
          <label for="custom-image-file">Immagine (opzionale)</label>
          <input type="file" id="custom-image-file" accept="image/*">
          <small>Scegli una foto dalla libreria; lascia vuoto per usare solo testo</small>
        </div>
        <div class="form-actions">
          <button type="button" id="cancel-custom" class="btn-secondary">Annulla</button>
          <button type="submit" class="btn-primary">Aggiungi</button>
        </div>
      </form>
    </div>
  </div>

  <div id="manage-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Gestisci Pittogrammi Personalizzati</h2>
        <button id="close-manage-modal" class="close-btn">✕</button>
      </div>
      <div id="custom-list"></div>
      <div class="form-actions">
        <button type="button" id="close-manage-btn" class="btn-secondary">Chiudi</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
</body>

</html>
